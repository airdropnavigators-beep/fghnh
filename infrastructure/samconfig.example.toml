version = 0.1

[default.validate.parameters]
lint = true

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "flowforge-staging"
resolve_s3 = true
s3_prefix = "flowforge-staging"
region = "ap-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = false
# CorsOriginList must list the same origins as CorsOrigins (JSON) — one is read by API
# Gateway, the other by the FastAPI middleware.
parameter_overrides = "Environment=\"staging\" BedrockRegion=\"us-east-1\" DocumentRetentionDays=\"1\" CorsOrigins='[\"http://localhost:5173\"]' CorsOriginList=\"http://localhost:5173\""
